name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-windows.yml'

env:
  TAURI_SKIP_DEVSERVER_CHECK: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Build Windows bundles (NSIS + MSI)
        run: npx tauri build --bundles nsis,msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package portable ZIP
        shell: pwsh
        run: |
          $release = "src-tauri\target\release"
          $portable = "shaoshao-pet-portable"
          New-Item -ItemType Directory -Path "$portable\public\sprites" -Force | Out-Null
          # 便携版 = exe + 精灵资源目录（Rust 端扫描 cwd/public/sprites）
          Copy-Item "$release\shaoshao-pet.exe" "$portable\" -ErrorAction SilentlyContinue
          Copy-Item "public\sprites\*.png" "$portable\public\sprites\" -ErrorAction SilentlyContinue
          Compress-Archive -Path "$portable\*" -DestinationPath "shaoshao-pet-portable.zip" -Force
          Get-ChildItem -Recurse $portable | Select-Object FullName, Length

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shaoshao-pet-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            shaoshao-pet-portable.zip
          if-no-files-found: error

      - name: Create release draft (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            shaoshao-pet-portable.zip
          draft: true
